name: Build

on:
  push:
  pull_request:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: npm ci
    - run: npm run test:lint
    - name: Publish compiled output to built branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B built
        for path in \
          blocks_compressed.js \
          blocks_compressed_horizontal.js \
          blocks_compressed_vertical.js \
          blockly_compressed_horizontal.js \
          blockly_compressed_vertical.js \
          blockly_uncompressed_horizontal.js \
          blockly_uncompressed_vertical.js \
          local_blockly_compressed_vertical.js \
          dist; do
          if [ -e "$path" ]; then
            git add -f "$path"
          fi
        done
        git commit -m "chore: rebuild compiled output for ${GITHUB_SHA} [skip ci]"
        git push --force origin built
